repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.10.0
    hooks:
      - id: pre-commit-update
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["-f", "-S", "*.csv, *.png"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.4
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix, --preview]
      # Run the formatter.
      - id: ruff-format
        args: [--preview]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        # Use the settings and file list in pyproject.toml instead of the hook defaults
        args: []
        pass_filenames: false
        additional_dependencies:
          - click >= 8.0.0
          - dash >= 3.0.0
          - matplotlib >= 3.8.0
          - numpy >= 2.0.0
          - pandas-stubs >= 2.1.1
          - tomli >= 2.0.0
          - tomli-w >= 1.2.0
